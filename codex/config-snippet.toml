# Codex CLI registration for jev-prd-check.
#
# Codex has no plugin-root variable like Claude Code's ${CLAUDE_PLUGIN_ROOT},
# so paths below use a placeholder token for this checkout's absolute path.
# Replace it yourself, or run scripts/setup.py --codex, which substitutes it
# for you, before appending this to ~/.codex/config.toml (or
# <repo>/.codex/config.toml for a single project).
#
# Uses `uv run --with-requirements` so dependencies resolve into a cached,
# ephemeral environment with no manual pip install and no bundled venv --
# requires uv (https://docs.astral.sh/uv/) on PATH.
#
# Schema per Codex's current hooks/config docs -- verified against the
# documented shape, not hand-tested against a live Codex install.

[mcp.jev_prd_check]
command = "uv"
args = ["run", "--with-requirements", "{{JEV_PRD_CHECK_ROOT}}/requirements.txt", "python3", "{{JEV_PRD_CHECK_ROOT}}/mcp_server.py"]

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "uv"
args = ["run", "--with-requirements", "{{JEV_PRD_CHECK_ROOT}}/requirements.txt", "python3", "{{JEV_PRD_CHECK_ROOT}}/hooks/on_stop.py"]
timeout = 60
statusMessage = "Checking branch diff against its ADO ticket..."

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "uv"
args = ["run", "--with-requirements", "{{JEV_PRD_CHECK_ROOT}}/requirements.txt", "python3", "{{JEV_PRD_CHECK_ROOT}}/hooks/on_stop.py"]
timeout = 60
statusMessage = "Checking branch diff against its ADO ticket..."
